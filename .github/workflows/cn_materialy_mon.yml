name: CN poniedzialek prep

# Kampania CN — prep poniedzialek
# Aktywny pipeline PL na GitHub Actions
on:
  schedule:
    - cron: "0 11 * * 1"
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: cn-pipeline
  cancel-in-progress: false

env:
  SCRAPER_TIMEZONE: Asia/Shanghai
  SERPER_DAILY_LIMIT: "1000"
  CLAUDE_UNLIMITED: "1"
  KANBUD_PROJECT_ROOT: ${{ github.workspace }}/libs

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-scraper

      - name: Resolve artifact run (niedziela)
        id: artifact_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name=="cn-materialy-wyniki-thu" and .expired==false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::Brak artefaktu cn-materialy-wyniki-thu"
            exit 1
          fi
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download cache from niedziela
        uses: actions/download-artifact@v4
        with:
          name: cn-materialy-wyniki-thu
          github-token: ${{ github.token }}
          run-id: ${{ steps.artifact_run.outputs.run-id }}
          path: .

      - name: Prep (rebuild Excel, bez wysylki)
        run: |
          python cn_materialy_scraper.py --run-config run_config/cn_materialy.json --rebuild-from-cache

      - name: Verify Excel vs JSON and fill missing fields (pass 1)
        run: |
          python scripts/verify_excel_from_json.py --campaign cn --wyniki Wyniki --passes 2

      - name: Verify Excel vs JSON and fill missing fields (pass 2)
        run: |
          python scripts/verify_excel_from_json.py --campaign cn --wyniki Wyniki --passes 2

      - name: Install Google Drive dependencies
        run: pip install -r requirements-drive.txt

      - name: Upload filled Excel to Google Drive
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID_CN }}
          GDRIVE_VERSION_XLSX: "0"
          GDRIVE_APPEND_XLSX: "1"
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_IMPERSONATE_EMAIL: ${{ secrets.GDRIVE_IMPERSONATE_EMAIL }}
          GDRIVE_SHARED_DRIVE_ID: ${{ secrets.GDRIVE_SHARED_DRIVE_ID }}
        run: |
          python scripts/gdrive_upload_wyniki.py --campaign-dir . --campaign cn

      - name: Upload Wyniki artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cn-materialy-wyniki-mon
          path: |
            Wyniki/
            wyslane/
